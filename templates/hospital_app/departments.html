{% extends 'hospital_app/base.html' %}

{% block content %}

<h1>Hospital Departments</h1>

{% for department in departments %}

<div class="card">

    <h2>{{ department.name }}</h2>

    <p>
        {{ department.description }}
    </p>

</div>

{% empty %}

<p>No departments available.</p>

{% endfor %}

{% endblock %}
